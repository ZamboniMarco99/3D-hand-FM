# Hydra config for training

data:
  train:
    time: 1
    height: 5
    width: 5
    frame_rate: 10
  train_loader:
    batch_size: 32
    num_workers: 4
  val_loader:
    batch_size: 32
    num_workers: 4

model:
  num_classes: 2
  learning_rate: 1e-3

logger:
  project: "dummy_video_classification"
  name: "dummy_model_run"
  save_dir: "./logs"