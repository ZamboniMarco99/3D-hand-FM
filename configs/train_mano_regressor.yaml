# Hydra config for training vae

defaults:
  - _self_
  - data: h20

task_name: "train_mano_regressor"

train: True

log_level: INFO

model:
  learning_rate: 1e-3

logger:
  name: "test_run"
  save_dir: "./logs"
  group: "train_mano_regressor"
  log_model: False # Don't log model weights

trainer:
  max_epochs: 20
  accelerator: "auto"
  devices: 1
