# Hydra config for training mano regressor

defaults:
  - _self_
  - data: h20_pretrained

task_name: "train_mano_regressor"

train: True

log_level: INFO

model:
  learning_rate: 1e-3
  loss_weights:
    keypoints_3d: 0.01
    keypoints_2d: 0.01
    global_orientation: 1
    pose: 1
    shape: 1

transforms:
  - VideoColorJitter
  sixd: True
  mano_params: 109

logger:
  name: "run_pretrained"
  save_dir: "./logs"
  group: "train_mano_regressor"
  log_model: True

trainer:
  max_epochs: 200
  accelerator: "auto"
  devices: 4
