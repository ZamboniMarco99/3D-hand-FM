[project]
name = "3d-hand-fm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Dependency of manopth
    "chumpy",
    "hydra-core>=1.3.2",
    "lightning>=2.4.0",
    "manopth",
    "matplotlib>=3.9.2",
    "open3d>=0.18.0",
    "opencv-python>=4.10.0.84",
    "torch>=2.4.1",
    "torchaudio>=2.4.1",
    "torchvision>=0.19.1",
    "wandb>=0.12.10",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.8",
]
no-build-isolation-package = ["chumpy"]

[tool.uv.sources]
manopth = { git = "https://github.com/hassony2/manopth" }
chumpy = { git = "https://github.com/mattloper/chumpy", rev = "9b045ff5d6588a24a0bab52c83f032e2ba433e17" }

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "T201",  # Avoid enforcing print rule
    "D401",  # Avoid enforcing imperative docstrings
    "PLR0913",  # Avoid enforcing too many arguments
    "D104",  # Avoid enforcing docstrings in __init__.py
    "G004",  # Permit f-strings in logging
    "FBT001",  # Permit boolean types in functions
    "FBT002",  # Permit boolean types in functions
    "S311",  # Permit non cryptographic random
]

[tool.ruff]
line-length = 120