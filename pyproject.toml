[project]
name = "3d-hand-fm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Dependency of manopth
    "chumpy",
    "hydra-core>=1.3.2",
    "lightning>=2.4.0",
    "manopth",
    "matplotlib>=3.9.2",
    "open3d>=0.18.0",
    "opencv-python>=4.10.0.84",
    "torch>=2.4.1",
    "torchaudio>=2.4.1",
    "torchvision>=0.19.1",
    "wandb>=0.12.10",
    "pytorch3d",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.8",
]
no-build-isolation-package = ["chumpy", "pytorch3d"]

[tool.uv.sources]
manopth = { git = "https://github.com/hassony2/manopth" }
chumpy = { git = "https://github.com/mattloper/chumpy", rev = "9b045ff5d6588a24a0bab52c83f032e2ba433e17" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d", rev = "stable" }

[tool.ruff.lint]
select = ["ALL"]
# Avoid enforcing print rule
# Avoid enforcing imperative docstrings
# Avoid enforcing too many arguments
# Avoid enforcing docstrings in __init__.py
# Permit f-strings in logging
# Permit boolean types in functions
# Permit docstrings that are preceded by a blank line
# Permit docstrings to start on the second physical line of the docstring
ignore = ["T201", "D401", "PLR0913", "D104", "G004", "FBT001", "FBT002", "D203", "D213"]

[tool.ruff]
line-length = 120