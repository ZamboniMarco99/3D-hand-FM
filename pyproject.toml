[project]
name = "3d-hand-fm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3.2",
    "lightning>=2.4.0",
    "manopth",
    "opencv-python>=4.10.0.84",
    "torch>=2.4.1",
    "torchaudio>=2.4.1",
    "torchvision>=0.19.1",
    "wandb>=0.12.10",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.8",
]

[tool.uv.sources]
manopth = { git = "https://github.com/hassony2/manopth" }

[tool.ruff.lint]
select = ["ALL"]
# Avoid enforcing print rule
# Avoid enforcing imperative docstrings
# Avoid enforcing too many arguments
# Avoid enforcing docstrings in __init__.py
# Permit f-strings in logging
# Permit boolean types in functions
ignore = ["T201", "D401", "PLR0913", "D104", "G004", "FBT001", "FBT002"]

[tool.ruff]
line-length = 120
